upstream ticket_api {
    least_conn;
    server api-1:8080;
    server api-2:8080;
    # Reuse upstream connections instead of a new TCP handshake per request under load.
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://ticket_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Exposes which instance served the request, handy to demo load balancing.
        add_header X-Upstream $upstream_addr always;
        # nginx's default, made explicit: only connection errors and timeouts fail over, and
        # a non-idempotent POST is never re-sent to another node once it reached one
        # (that would need `non_idempotent`). Clients retry with the same Idempotency-Key.
        proxy_next_upstream error timeout;
    }
}
