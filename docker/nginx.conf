upstream ticket_api {
    least_conn;
    server api-1:8080;
    server api-2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://ticket_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Exposes which instance served the request, handy to demo load balancing.
        add_header X-Upstream $upstream_addr always;
        # Never let nginx transparently retry a non-idempotent POST on another node;
        # clients retry explicitly with the same Idempotency-Key instead.
        proxy_next_upstream error timeout;
    }
}
