x-api: &api
  build: .
  image: ticket-brasil-api:local
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/ticketbrasil
    DB_USER: ticket
    DB_PASSWORD: ticket
    DB_POOL_SIZE: 20
    RESERVATION_TTL: ${RESERVATION_TTL:-PT10M}
    EXPIRATION_INTERVAL: ${EXPIRATION_INTERVAL:-PT5S}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketbrasil
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketbrasil"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-1:
    <<: *api

  api-2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
